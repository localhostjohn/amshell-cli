[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amshell"
version = "2.0.0rc1"
description = "IT asset inventory and lifecycle management from the command line"
readme = "README.md"
authors = [{ name = "John Weekes" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["asset-management", "infrastructure", "sqlite", "cli", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
amshell = "amshell.snapshot_cli:app"

[project.urls]
Homepage = "https://github.com/localhostjohn/amshell-cli"
Repository = "https://github.com/localhostjohn/amshell-cli"
Issues = "https://github.com/localhostjohn/amshell-cli/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
